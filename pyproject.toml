[project]
name = "agent-system"
version = "0.1.0"
description = "Agent harness with shared registry, guardrails and evals"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langgraph>=1.2.15",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-system = "agent_system:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
