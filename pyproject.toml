[project]
name = "agent-system"
version = "0.1.0"
description = "Agent harness with shared registry, guardrails and evals"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg-binary>=3.3.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-system = "agent_system:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.ruff]
src = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
