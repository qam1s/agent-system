[project]
name = "back"
version = "0.1.0"
description = "Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.154.0",
    "langchain>=1.4.6",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-binary>=3.3.6",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["back"]

[tool.ty.environment]
python = "../.venv"

[tool.fastapi]
entrypoint = "back.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["back"]
