[project]
name = "front"
version = "0.1.0"
description = "Frontend"
requires-python = ">=3.13"
dependencies = [
    "gradio>=5.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["front"]

[tool.ty.environment]
python = "../.venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["front"]
